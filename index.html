<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Inventory v1 Mock</title>
  <style>
    :root{
      --bg:#f6f8fb; --card:#fff; --line:#e5e7eb; --text:#111827; --muted:#6b7280;
      --nav:#0f172a; --navText:#e2e8f0; --primary:#111827; --accent:#2563eb;
      --green:#166534; --greenBg:#dcfce7; --blue:#1d4ed8; --blueBg:#dbeafe;
      --yellow:#a16207; --yellowBg:#fef3c7; --red:#b91c1c; --redBg:#fee2e2;
      --purple:#7e22ce; --purpleBg:#f3e8ff; --slate:#475569; --slateBg:#e2e8f0;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .hidden{display:none!important}
    .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
    .sidebar{background:var(--nav);color:#fff;padding:20px 16px}
    .brand{font-size:20px;font-weight:800;margin-bottom:4px}
    .subbrand{font-size:12px;color:#cbd5e1;margin-bottom:16px}
    .rolebox{padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.04);margin-bottom:16px}
    .rolebox .name{font-weight:700}
    .nav{display:flex;flex-direction:column;gap:8px}
    .nav button{all:unset;cursor:pointer;padding:11px 12px;border-radius:12px;color:var(--navText);font-size:14px}
    .nav button.active,.nav button:hover{background:rgba(255,255,255,.11);color:#fff}
    .main{padding:24px;overflow:auto}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
    .title{font-size:28px;font-weight:800;letter-spacing:-.02em}
    .subtitle{font-size:14px;color:var(--muted);margin-top:4px;max-width:900px}
    .topActions{display:flex;gap:10px;flex-wrap:wrap}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .grid{display:grid;gap:16px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .two-col{display:grid;grid-template-columns:1.45fr .85fr;gap:16px}
    h2,h3,h4{margin:0 0 8px}
    .hint{font-size:13px;color:var(--muted);margin-bottom:10px}
    .metric{font-size:28px;font-weight:800;margin-top:4px}
    .muted{color:var(--muted)}
    .small{font-size:12px}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font:inherit}
    textarea{min-height:92px;resize:vertical}
    .btn{border:none;background:var(--primary);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
    .btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
    .btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}
    .btn.blue{background:var(--accent)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
    .toolbar > div{min-width:150px}
    .tableWrap{overflow:auto}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{text-align:left;padding:12px;border-top:1px solid var(--line);vertical-align:top}
    thead th{border-top:none;background:#f8fafc;color:#334155;font-weight:700}
    .badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}
    .b-available{background:var(--greenBg);color:var(--green)}
    .b-in_use{background:var(--blueBg);color:var(--blue)}
    .b-low_stock{background:var(--yellowBg);color:var(--yellow)}
    .b-expired{background:var(--redBg);color:var(--red)}
    .b-quarantined{background:var(--purpleBg);color:var(--purple)}
    .b-draft{background:var(--slateBg);color:var(--slate)}
    .b-disposed{background:#f1f5f9;color:#475569;text-decoration:line-through}
    .list{display:flex;flex-direction:column;gap:10px}
    .listItem{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
    .pillnav{display:flex;flex-wrap:wrap;gap:10px}
    .pillnav button{all:unset;cursor:pointer;background:#fff;border:1px solid var(--line);padding:11px 13px;border-radius:14px;font-weight:700;font-size:14px}
    .fieldGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .field{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}
    .field .k{font-size:12px;color:var(--muted);margin-bottom:6px}
    .field .v{font-weight:700;word-break:break-word}
    .timeline{display:flex;flex-direction:column;gap:12px}
    .event{display:flex;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
    .section{display:none}
    .section.active{display:block}
    .message{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px}
    .success{background:var(--greenBg);color:var(--green)}
    .info{background:#eef2ff;color:#3730a3}
    .warn{background:var(--yellowBg);color:#92400e}
    .tree ul{list-style:none;padding-left:18px}
    .tree li{margin:6px 0}
    .tree .node{display:inline-block;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
    .loginWrap{max-width:440px;margin:10vh auto;padding:20px}
    .loginCard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
    .kpi{display:flex;justify-content:space-between;align-items:end}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .b-priority-urgent{background:#fee2e2;color:#b91c1c;font-weight:800}
    .b-priority-high{background:#fef3c7;color:#a16207;font-weight:800}
    .b-priority-normal{background:#f0fdf4;color:#166534;font-weight:700}
    @media (max-width:1100px){
      .app{grid-template-columns:1fr}
      .two-col,.grid-4,.grid-3,.grid-2,.fieldGrid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div id="loginView" class="loginWrap">
  <div class="loginCard">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div class="brand" style="color:#111827">Lab Inventory</div>
      <button id="loginLangToggle" style="border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer;font-weight:600" onclick="toggleLang()">🌐 EN</button>
    </div>
    <div id="loginSubbrand" class="subbrand" style="color:#64748b;margin-bottom:16px">研究室向け在庫・発注・承認・受領・管理</div>
    <label id="loginRoleLabel">ログインするロール</label>
    <select id="loginRole">
      <option value="STUDENT">学生</option>
      <option value="PROFESSOR">教授</option>
      <option value="SECRETARY">秘書</option>
      <option value="ADMIN">管理者</option>
    </select>
    <label id="loginUserLabel" style="margin-top:12px">表示用ユーザー</label>
    <select id="loginUser"></select>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn" id="loginBtn" onclick="login()">ログイン</button>
    </div>
    <div class="message info" id="loginHint" style="margin-top:12px">フロントモックです。主要業務フローを一通り試せます。</div>
  </div>
</div>
<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand">Lab Inventory</div>
    <div class="subbrand" id="appSubbrand">v1 Mock</div>
    <div class="rolebox">

      <div class="small" id="sideUserRole"></div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn secondary" style="padding:6px 10px;font-size:12px" onclick="logout()" id="logoutBtn">Log out</button>
        <button id="langToggle" class="btn secondary" style="padding:6px 10px;font-size:12px;font-weight:700" onclick="toggleLang()">🌐 EN</button>
      </div>
    </div>

  </aside>

    <div class="topbar">

        <div class="subtitle" id="pageSubtitle"></div>
      </div>
      <div class="topActions" id="topActions"></div>

    <section id="request-new" class="section"></section>

    <section id="request-detail" class="section"></section>
    <section id="approvals" class="section"></section>
    <section id="approval-detail" class="section"></section>
    <section id="receipts" class="section"></section>
    <section id="receipt-history" class="section"></section>
    <section id="aliquots" class="section"></section>
    <section id="batches" class="section"></section>
    <section id="locations" class="section"></section>
    <section id="admin-home" class="section"></section>
    <section id="admin-users" class="section"></section>
    <section id="admin-products" class="section"></section>
    <section id="admin-locations" class="section"></section>
    <section id="admin-adjustments" class="section"></section>
    <section id="admin-import" class="section"></section>
    <section id="admin-audit" class="section"></section>

    <section id="prof-dashboard" class="section"></section>
    <section id="products" class="section"></section>
    <section id="recipes" class="section"></section>
  </main>
</div>

function navSectionsForRole(role){
  if(role === "STUDENT")
    return ["dashboard","inventory","products","recipes","requests","receipts","locations"];
  if(role === "PROFESSOR" || role === "SECRETARY")
    return ["prof-dashboard","approvals","receipts","receipt-history","requests","inventory","products","recipes","locations"];
  if(role === "ADMIN")
    return ["admin-home","admin-users","admin-import","admin-audit"];
  return ["dashboard"];
}
function allowedSectionsForRole(role){
  const common = ["inventory","detail","request-new","requests","request-detail",
    "aliquots","batches","locations","products","recipes","receipts","receipt-history","order-board","prof-dashboard"];
  if(role === "STUDENT")    return ["dashboard", ...common];
  if(role === "PROFESSOR" || role === "SECRETARY")
    return ["approvals","approval-detail", ...common];

function recalcRequestStatus(req){
  const totals=req.lines.map(l=>({requested:Number(l.quantityRequested),received:receivedQtyForLine(l.id)}));
  const totalRequested=totals.reduce((s,t)=>s+t.requested,0);
  const totalReceived=totals.reduce((s,t)=>s+t.received,0);
  if(totalReceived >= totalRequested) return "COMPLETED";

  return req.status;
}

  const newLocId=$("inline-move-loc").value;
  const reason=$("inline-move-reason").value.trim()||t("move_default");
  if(!newLocId){ $("move-msg").innerHTML=`<div class="message info">${t("msg_move_sel")}</div>`; return; }
  const from=item.locationId; item.locationId=newLocId;
  eventPush({inventoryItemId:item.id, eventType:"MOVE", quantityDelta:0, quantityUnit:item.quantityUnit, actorUserId:ui.currentUserId, notes:`${locationPath(from)} → ${locationPath(newLocId)} / ${reason}`});
  $("move-msg").innerHTML=`<div class="message success">${t("msg_move_done")} → ${locationPath(newLocId)}</div>`;
  renderInventory(); renderLocations(); setTimeout(renderDetail,50);
}

function previewProtocolFile(input){
  const f=input.files[0]; if(!f) return;
  $("rec-file-preview").innerHTML=`<div style="font-size:12px;color:var(--muted);margin-top:4px">${t("loc_selected")} ${f.name}</div>`;
}

function buildRecipeFromForm(){
  const name=$("rec-name")?.value.trim(); if(!name) return null;
  const proto=$("rec-protocol")?.files[0];
  return {
    name,
    batchType:$("rec-type")?.value||"PREPARED_MEDIA",
    description:$("rec-desc")?.value.trim()||"",
    components:(ui.editingRecipeComps||[]).filter(c=>c.productId&&c.quantity>0).map(c=>({...c})),
    protocolFileName: proto ? proto.name : undefined,
  };
}
function createRecipe(){
  const d=buildRecipeFromForm(); if(!d){ $("rec-msg").innerHTML=`<div class="message info">${t("msg_recipe_name")}</div>`; return; }
  if(!d.components.length){ $("rec-msg").innerHTML=`<div class="message info">${t("msg_batch_no_comp")}</div>`; return; }
  state.recipes.unshift({ id:nextId("rec"), ...d, protocolFileName:d.protocolFileName||null, createdById:ui.currentUserId, createdAt:TODAY, isActive:true });
  ui.editingRecipeComps=null; $("recipes").dataset.editId=""; renderRecipes();
}
function saveRecipe(id){
  const d=buildRecipeFromForm(); if(!d){ $("rec-msg").innerHTML=`<div class="message info">${t("msg_recipe_name")}</div>`; return; }
  const r=state.recipes.find(q=>q.id===id);
  r.name=d.name; r.batchType=d.batchType; r.description=d.description; r.components=d.components;
  if(d.protocolFileName) r.protocolFileName=d.protocolFileName;
  ui.editingRecipeComps=null; $("recipes").dataset.editId=""; renderRecipes();
}
// レシピを選んで混合物作成画面に成分を展開
function applyRecipeToBatch(recipeId){
  const r=state.recipes.find(q=>q.id===recipeId); if(!r) return;
  ui.pendingBatchComps = r.components.map(c=>({
    id:nextId("bc"),
    itemId: state.inventory.find(i=>i.productId===c.productId&&i.currentQuantity>0)?.id || state.inventory[0]?.id,
    qty:c.quantity, unit:c.unit
  }));
  activateSection("batches");
}

function editDraft(reqId){
  const req = requestById(reqId);
  if(!req || req.status !== "DRAFT") return;
  if(req.requesterId !== ui.currentUserId){ alert(t("msg_other_draft")); return; }
  ui.editingDraftId = reqId;
  ui.pendingLines = req.lines.map(l=>({...l}));
  activateSection("request-new");
}

function submitDraft(reqId){
  const req = requestById(reqId);
  if(!req || req.status !== "DRAFT") return;
  if(req.requesterId !== ui.currentUserId){ alert(t("msg_other_submit")); return; }
  req.status = "SUBMITTED"; req.submittedAt = TODAY;
  ui.currentRequestId = reqId;
  renderRequests(); renderApprovals(); renderRequestDetail(); renderDashboard();
}

function addPendingLine(){
  const name = $("add-name").value.trim();
  const qty  = Number($("add-qty").value || 0);
  if(!name || qty <= 0){ $("add-line-msg").innerHTML=`<div class="message info">${t("msg_enter_qty")}</div>`; return; }
  const p = state.products.find(p => p.name===name || p.aliasName===name);
  ui.pendingLines.push({
    id: nextId("line"),
    productId: p?.id || null,
    vendorId: $("add-vendor").value || null,
    productNameSnapshot: name,
    manufacturerSnapshot: $("add-manufacturer").value.trim(),
    catalogNumberSnapshot: $("add-catalog").value.trim(),
    quantityRequested: qty,
    quantityUnit: $("add-unit").value.trim() || t("unit_bottle"),
  });
  $("add-name").value=""; $("add-manufacturer").value=""; $("add-catalog").value=""; $("add-qty").value="1";
  $("add-line-msg").innerHTML="";
  renderPendingLines();
}
// 製品マスタ登録済みの製品を選んだとき、メーカー・カタログ番号・単位を自動補完
function autofillProductFields(){
  const name = $("add-name")?.value.trim();
  const p = state.products.find(p=>p.name===name||p.aliasName===name);
  if(!p) return;
  if($("add-manufacturer")) $("add-manufacturer").value = p.manufacturer||"";
  if($("add-catalog"))      $("add-catalog").value      = p.catalogNumber||"";
  if($("add-unit"))         $("add-unit").value          = p.defaultUnit==="mL"?t("unit_bottle"):(p.defaultUnit||t("unit_bottle"));
  const vSel = $("add-vendor");
  if(vSel && p.vendorId) vSel.value = p.vendorId;
}
function removePendingLine(idx){ ui.pendingLines.splice(idx, 1); renderPendingLines(); }

function buildRequestFromForm(status){
  const existing = ui.editingDraftId ? requestById(ui.editingDraftId) : null;
  const requesterId = $("req-requester")?.value || ui.currentUserId;
  const requester = userById(requesterId);
  return {
    id: ui.editingDraftId || nextId("req"),
    requestNo: existing?.requestNo || nextRequestNo(),
    requesterId,
    requesterCodeSnapshot: requester?.memberCode || currentUser().memberCode,
    status,
    priority: $("req-priority")?.value || "NORMAL",
    purpose: $("req-purpose")?.value?.trim() || "",
    submittedAt: status==="SUBMITTED" ? TODAY : null,
    approvedAt:null, approverId:null, approvalComment:null, orderedAt:null,
    lines: ui.pendingLines.map(l=>({...l})),
  };
}

function saveDraftRequest(){
  if(!ui.pendingLines.length){ $("req-msg").innerHTML=`<div class="message info">${t("msg_add_line")}</div>`; return; }
  const req = buildRequestFromForm("DRAFT");
  if(ui.editingDraftId){
    const idx = state.requests.findIndex(r=>r.id===ui.editingDraftId);
    if(idx>=0) state.requests[idx] = req;
  } else {
    state.requests.unshift(req);
  }
  ui.editingDraftId = null; ui.pendingLines = [];
  $("req-msg").innerHTML=`<div class="message success">${t("msg_draft_saved")} ${req.requestNo}</div>`;
  renderRequests();
}

function submitRequest(){
  if(!ui.pendingLines.length){ $("req-msg").innerHTML=`<div class="message info">${t("msg_add_line")}</div>`; return; }
  const req = buildRequestFromForm("SUBMITTED");
  if(ui.editingDraftId){
    const idx = state.requests.findIndex(r=>r.id===ui.editingDraftId);
    if(idx>=0) state.requests[idx] = req;
  } else {
    state.requests.unshift(req);
  }
  ui.editingDraftId = null; ui.pendingLines = [];
  $("req-msg").innerHTML=`<div class="message success">${t("msg_submitted")} ${req.requestNo}</div>`;
  renderDashboard(); renderRequests(); renderApprovals();
}

function openRequestDetail(id){

  const target = (ui.currentRole==="PROFESSOR"||ui.currentRole==="SECRETARY") ? "approval-detail" : "request-detail";

}

// [FIX BUG-10] PROFESSOR/SECRETARY も自分の依頼一覧を見られる（+ 新規依頼作成ボタン追加）
function renderRequests(){
  // 学生は自分の依頼のみ。教授・秘書・管理者は全件
  const isApprover = ["PROFESSOR","SECRETARY","ADMIN"].includes(ui.currentRole);
  const rawList = isApprover
    ? state.requests
    : state.requests.filter(r=>r.requesterId===ui.currentUserId);
  // 緊急性の高い順・同順なら申請日の新しい順
  const list = [...rawList].sort((a,b)=>{
    const pd = priorityOrder(a.priority) - priorityOrder(b.priority);
    if(pd!==0) return pd;
    return (b.submittedAt||"").localeCompare(a.submittedAt||"");

    .sort((a,b)=>{
      const order={ORDERED:0,PARTIALLY_RECEIVED:1,APPROVED:2,SUBMITTED:3};
      const sd=(order[a.status]??9)-(order[b.status]??9);
      if(sd!==0) return sd;
      return priorityOrder(a.priority)-priorityOrder(b.priority);
    });

  const currentTab = $("requests").dataset.tab || "list";
  const statusColor = {
    SUBMITTED:"#eef2ff|#3730a3",

    ORDERED:"#dcfce7|#166534",
    PARTIALLY_RECEIVED:"#dbeafe|#1d4ed8",

    req.lines.forEach(line=>{

      const [bg,col]=(statusColor[req.status]||"#f1f5f9|#475569").split("|");
      boardRows.push({req,line,rcv,total,pct,bg,col});

  $("requests").innerHTML=`

              onclick="$('requests').dataset.tab='list';renderRequests()">

              style="padding:7px 16px;font-size:13px;font-weight:700;border:none;border-left:1px solid var(--line);cursor:pointer;transition:background .15s;background:${currentTab==="board"?"var(--blue)":"#fff"};color:${currentTab==="board"?"#fff":"var(--text)"}"
              onclick="$('requests').dataset.tab='board';renderRequests()">
              ${t("order_board")}
            </button>

        </div>
        <button class="btn secondary" style="white-space:nowrap" onclick="openNewRequest()">${t("btn_new_req")}</button>
      </div>

      ${currentTab==="list" ? `
        <div class="hint" style="margin-bottom:12px">${t("sub_requests")}</div>
        <div class="list">${list.map(r=>`
          <div class="listItem">
            <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">

                <div style="font-weight:800">${r.requestNo}</div>

                <div class="small muted">${t("fld_submitted")}: ${r.submittedAt||t("draft_label")}</div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
                <span class="badge ${statusClass(r.status)}">${statusLabel(r.status)}</span>
                <span class="badge b-priority-${r.priority?.toLowerCase()}" style="font-size:11px;padding:3px 8px">${priorityBadge(r.priority)}</span>
              </div>
            </div>
            <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn secondary" onclick="openRequestDetail('${r.id}')">${t("btn_detail")}</button>
              ${r.status==="DRAFT"&&r.requesterId===ui.currentUserId?`<button class="btn" onclick="editDraft('${r.id}')">${t("btn_edit")}</button><button class="btn secondary" onclick="submitDraft('${r.id}')">${t("btn_submit")}</button>`:""}
            </div>
          </div>`).join("") || `<div class="muted">${t("msg_no_requests")}</div>`}
        </div>
      ` : `
        <div class="hint" style="margin-bottom:12px">${t("order_board_sub")}</div>
        ${boardRows.length===0 ? `<div class="muted">${t("order_board_empty")}</div>` : `
        <div class="tableWrap">
          <table>
            <thead><tr>

              <th style="min-width:80px;text-align:right">${t("ob_qty_rcv")}</th>
              <th style="min-width:120px">${t("ob_progress")}</th>
              <th>${t("fld_submitted")}</th>
              <th>${t("fld_approved")}</th>
              <th>${t("fld_ordered")}</th>
              <th></th>
            </tr></thead>
            <tbody>${boardRows.map(({req,line,rcv,total,pct,bg,col})=>`
              <tr style="border-left:4px solid ${col};background:${bg}18">
                <td>
                  <span style="display:inline-block;padding:4px 8px;border-radius:8px;font-size:12px;font-weight:800;background:${bg};color:${col}">

                <td style="font-weight:700;font-size:13px">${req.requestNo}</td>
                <td class="small">${userById(req.requesterId)?.name||"-"}</td>
                <td>
                  <div style="font-weight:700">${line.productNameSnapshot}</div>
                  <div class="small muted">${line.manufacturerSnapshot||""} ${line.catalogNumberSnapshot||""}</div>
                </td>
                <td style="text-align:right;font-weight:700">${fmtQty(total)} ${line.quantityUnit}</td>
                <td style="text-align:right;color:${rcv>0?"var(--green)":"var(--muted)"}">${rcv>0?fmtQty(rcv)+" "+line.quantityUnit:"-"}</td>
                <td>

                </td>
                <td class="small muted">${req.submittedAt||"-"}</td>
                <td class="small muted">${req.approvedAt||"-"}</td>
                <td class="small muted">${req.orderedAt||"-"}</td>
                <td><button class="btn secondary" style="padding:4px 8px;font-size:12px;white-space:nowrap" onclick="openRequestDetail('${req.id}')">${t("btn_detail")}</button></td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>`}
      `}
    </div>`;
}

${req.id}')">${t("btn_submit")}</button></div>`:""}<div style="margin-top:18px"><h3>${t("sec_receipt_history")}</h3><div class="list">${receipts.map(r=>`<div class="listItem"><div style="font-weight:700">${r.receivedDate}</div><div class="small muted">数量: ${fmtQty(r.quantityReceived)} ${r.quantityUnit} / Lot: ${r.lotNumber || "-"}</div><div class="small muted">保管先: ${locationPath(r.locationId)}</div></div>`).join("") || `<div class="muted">${t("msg_no_history")}</div>`}</div></div></div>`;

><div class="list">${state.requests.filter(r=>r.lines.some(l=>l.productId===firstLine?.productId) && r.id!==req.id).slice(0,3).map(r=>`<div class="listItem"><div style="font-weight:700">${r.requestNo}</div><div class="small muted">${statusLabel(r.status)}</div></div>`).join("") || `<div class="muted">${t("msg_no_events")}</div>`}</div></div></div></div>`;

// [FIX BUG-07] 承認成功後に「受領登録へ →」リンクを表示
function approveCurrentRequest(){
  if(!["PROFESSOR","SECRETARY","ADMIN"].includes(ui.currentRole)){ $("approval-msg").innerHTML=`<div class="message info">${t("msg_approval_no_perm")}</div>`; return; }
  const req=requestById(ui.currentRequestId);
  if(!req){ $("approval-msg").innerHTML=`<div class="message info">${t("msg_no_req_sel")}</div>`; return; }
  if(req.status!=="SUBMITTED"){ $("approval-msg").innerHTML=`<div class="message info">${t("msg_only_submitted")}</div>`; return; }
  req.status="APPROVED"; req.approverId=ui.currentUserId; req.approvedAt=TODAY; req.approvalComment=$("approval-comment").value.trim();
  renderApprovalDetail();
  $("approval-msg").innerHTML=`<div class="message success">${t("msg_approved")} <button class="btn secondary" style="padding:6px 12px;font-size:12px;margin-left:8px" onclick="activateSection('receipts')">${t("approval_goto_receipt")}</button></div>`;
  renderApprovals(); renderRequestDetail();
}
// [FIX BUG-02] 差し戻しにもロールチェック
function rejectCurrentRequest(){
  if(!["PROFESSOR","SECRETARY","ADMIN"].includes(ui.currentRole)){ $("approval-msg").innerHTML=`<div class="message info">${t("msg_approval_no_perm")}</div>`; return; }
  const req=requestById(ui.currentRequestId);
  if(!req){ $("approval-msg").innerHTML=`<div class="message info">${t("msg_no_req_sel")}</div>`; return; }
  if(req.status!=="SUBMITTED"){ $("approval-msg").innerHTML=`<div class="message info">${t("msg_only_submitted")}</div>`; return; }
  req.status="REJECTED"; req.approverId=ui.currentUserId; req.approvedAt=TODAY; req.approvalComment=$("approval-comment").value.trim() || t("btn_reject");
  renderApprovalDetail();
  $("approval-msg").innerHTML=`<div class="message success">${t("msg_rejected")}</div>`; renderApprovals(); renderRequestDetail();
}
// [FIX BUG-15] APPROVED 以外では発注済みにできない（ボタン制御は renderApprovalDetail 側で行う）
function markOrderedCurrentRequest(){
  const req=requestById(ui.currentRequestId);
  if(!req||req.status!=="APPROVED"){ $("approval-msg").innerHTML=`<div class="message info">${t("msg_order_approved")}</div>`; return; }
  req.status="ORDERED"; req.orderedAt=TODAY;
  renderApprovalDetail();
  $("approval-msg").innerHTML=`<div class="message success">${t("msg_ordered")}</div>`; renderApprovals();
}
function renderReceipts(){

  const eligible = state.requests.filter(r => {
    if(!["APPROVED","ORDERED","PARTIALLY_RECEIVED"].includes(r.status)) return false;
    return r.lines.some(l => receivedQtyForLine(l.id) < Number(l.quantityRequested));
  });
  $("receipts").innerHTML=`<div class="card"><h3>${t("sec_receipts")}</h3><div class="hint">${t("receipt_hint")}</div>${eligible.length===0?`<div class="message info" style="margin-top:12px">${t("msg_no_receipts")}</div><div style="margin-top:10px"><button class="btn secondary" onclick="activateSection('receipt-history')">${t("btn_receipt_hist")}</button></div>`:`<label>${t("lbl_target_req")}</label><select id="receipt-request" onchange="refreshReceiptLineOptions()">${eligible.map(r=>`<option value="${r.id}">${r.requestNo} / ${userById(r.requesterId)?.name || "-"} / ${statusLabel(r.status)}</option>`).join("")}</select><label style="margin-top:12px">${t("lbl_target_line")}</label><select id="receipt-line"></select><div class="grid grid-3" style="margin-top:12px"><div><label>${t("lbl_recv_date")}</label><input id="receipt-date" value="${TODAY}"></div><div><label>${t("lbl_recv_by")}</label><input id="receipt-by" value="${currentUser().name}"></div><div><label>${t("lbl_qty")}</label><input id="receipt-qty" value="1"></div><div><label>${t("lbl_unit")}</label><input id="receipt-unit" value="本"></div><div><label>${t("lbl_lot")}</label><input id="receipt-lot" placeholder="${ui.lang==='en'?'Optional':'任意'}"></div></div><label style="margin-top:12px">${t("lbl_location")}</label><select id="receipt-loc">${state.locations.map(l=>`<option value="${l.id}">${locationPath(l.id)}${l.note?` — ${l.note}`:""}</option>`).join("")}</select><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn" onclick="receiveSelectedLine()">${t("btn_receive")}</button><button class="btn secondary" onclick="activateSection('receipt-history')">${t("btn_receipt_hist")}</button></div><div id="receipt-msg"></div>`}</div>`;
  if(eligible.length) refreshReceiptLineOptions();
}

function updateBatchComp(idx, field, value){
  if(!ui.pendingBatchComps[idx]) return;
  ui.pendingBatchComps[idx][field] = value;
  // qty変更時は合計量ラベルだけ更新（tbody再描画はしない→フォーカス維持）
  if(field==="qty"){
    const total = ui.pendingBatchComps.reduce((s,c)=>s+Number(c.qty||0), 0);
    const fv = $("batch-final"); if(fv) fv.value = fmtQty(total);
    // 合計行を更新（ラベルがあれば）
    const sumEl = $("batch-comp-sum"); if(sumEl) sumEl.textContent = `${t("batch_comp_total")} ${fmtQty(total)}`;
  }
  // itemId変更時は表示名を更新
  if(field==="itemId"){
    const nameEl = document.querySelector(`#batch-comp-rows tr:nth-child(${idx+1}) td:first-child select`);
    if(nameEl) nameEl.value = value;
  }
}

function createBatch(){
  const name = $("batch-name").value.trim();
  const finalVol = Number($("batch-final").value);
  if(!name){ $("batch-msg").innerHTML=`<div class="message info">${t("msg_enter_name")}</div>`; return; }
  if(!ui.pendingBatchComps.length){ $("batch-msg").innerHTML=`<div class="message info">${t("msg_batch_no_comp")}</div>`; return; }
  const comps = ui.pendingBatchComps.map(c=>({ item:inventoryById(c.itemId), qty:Number(c.qty||0), unit:c.unit }));
  if(comps.some(c=>!c.item||c.qty<=0)){ $("batch-msg").innerHTML=`<div class="message info">${t("msg_batch_qty_err")}</div>`; return; }
  if(comps.some(c=>c.qty>c.item.currentQuantity)){ $("batch-msg").innerHTML=`<div class="message info">${t("msg_batch_over")}</div>`; return; }
  if(finalVol<=0){ $("batch-msg").innerHTML=`<div class="message info">${t("msg_batch_final_err")}</div>`; return; }
  // [v4] ±10%制限を撤廃 — 最終容量は自由に設定可
  // 元在庫消費
  comps.forEach(c=>{
    c.item.currentQuantity -= c.qty; c.item.status=recalcInventoryStatus(c.item);
    eventPush({inventoryItemId:c.item.id, eventType:"MIX_SOURCE_CONSUME", quantityDelta:-c.qty, quantityUnit:c.unit, actorUserId:ui.currentUserId, notes:`${name} 作成`});
  });
  // 混合物在庫を生成
  const item={ id:nextId("inv"), productId:null, parentItemId:null, displayName:name, barcode:"INV-BATCH-"+Math.random().toString(36).slice(2,7).toUpperCase(), lotNumber:null, receivedDate:TODAY, openedDate:null, expirationDate:null, initialQuantity:finalVol, currentQuantity:finalVol, quantityUnit:$("batch-unit").value.trim(), status:"AVAILABLE", locationId:$("batch-loc").value, createdById:ui.currentUserId };
  state.inventory.unshift(item);
  eventPush({inventoryItemId:item.id, eventType:"MIX_CREATE", quantityDelta:finalVol, quantityUnit:item.quantityUnit, actorUserId:ui.currentUserId, notes:`${name} 作成完了`});
  // [FIX BUG-06/MISS-03] DerivedBatch / DerivedBatchComponent を state に記録
  const batchId = nextId("db");
  state.derivedBatches.unshift({id:batchId, name, batchType:$("batch-type").value, resultItemId:item.id, createdById:ui.currentUserId, createdAt:TODAY});
  comps.forEach(c=>{ state.derivedBatchComponents.push({id:nextId("dbc"), derivedBatchId:batchId, sourceItemId:c.item.id, quantityUsed:c.qty, quantityUnit:c.unit}); });
  ui.pendingBatchComps=[];
  $("batch-msg").innerHTML=`<div class="message success">${name} ${t("msg_received")} <button class="btn secondary" style="padding:5px 12px;font-size:12px;margin-left:8px" onclick="openDetail('${item.id}')">${t("msg_inv_detail")}</button></div>`;
  renderInventory(); renderDashboard();
}

function collectDescendantIds(id){
  const children=state.locations.filter(l=>l.parentId===id);
  return children.reduce((acc,c)=>[...acc,c.id,...collectDescendantIds(c.id)],[]);
}

// [FIX BUG-B] 子孫も含めて在庫チェック → 再帰削除
function deleteLocation(id){
  const allIds = [id, ...collectDescendantIds(id)];
  const blockedItems = state.inventory.filter(i=>allIds.includes(i.locationId) && i.status!=="DISPOSED");
  if(blockedItems.length>0){
    alert(ui.lang==="en"?`This location has ${blockedItems.length} item(s) (including sub-locations). Move inventory first.`:t("msg_loc_inv"));
    return;
  }
  const childCount = allIds.length - 1;
  const msg = childCount > 0
    ? (ui.lang==="en"?`Delete "${locationById(id)?.name}" and its ${childCount} sub-location(s)?`:`「${locationById(id)?.name}」とその子ロケーション ${childCount} 件をすべて削除しますか？`)
    : (ui.lang==="en"?`Delete "${locationById(id)?.name}"?`:`「${locationById(id)?.name}」を削除しますか？`);
  if(!confirm(msg)) return;
  state.locations = state.locations.filter(l=>!allIds.includes(l.id));
  ui.currentLocationId = state.locations[0]?.id || null;
  $("locations").dataset.editId="";
  renderLocations();
}
function saveEditLocation(id){
  const name=$("loc-name").value.trim();
  if(!name){ $("loc-msg").innerHTML=`<div class="message info">${t("msg_enter_name")}</div>`; return; }
  const l=locationById(id);
  l.name=name; l.parentId=$("loc-parent").value||null; l.type=$("loc-type").value; l.note=$("loc-note").value.trim();
  $("locations").dataset.editId=""; renderLocations();
}
function createLocation(){
  const name=$("loc-name").value.trim();
  if(!name){ $("loc-msg").innerHTML=`<div class="message info">${t("msg_enter_name")}</div>`; return; }
  state.locations.push({ id:nextId("loc"), name, type:$("loc-type").value, parentId:$("loc-parent").value||null, note:$("loc-note").value.trim(), isActive:true });
  $("loc-msg").innerHTML=`<div class="message success">${t("msg_created_loc")}</div>`;
  renderLocations();
}

function csvCell(v){
  if(v==null) return "";
  const s=String(v);
  return (s.includes(",")||s.includes('"')||s.includes("\n"))
    ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function downloadText(filename,text){
  // CSV: UTF-8 BOM付きで保存 → Excel/Windows で文字化けしない
  const isCsv  = filename.endsWith('.csv');
  const isJson = filename.endsWith('.json');
  const mime    = isCsv  ? 'text/csv;charset=utf-8'
                : isJson ? 'application/json;charset=utf-8'
                :          'text/plain;charset=utf-8';
  const bom     = isCsv ? '\uFEFF' : '';   // UTF-8 BOM
  const content = bom + text;
  try{
    // Blob 方式（http / https 環境）
    const blob = new Blob([content], {type: mime});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }catch(e){
    // file:// プロトコル対応: data: URI 方式
    const a = document.createElement('a');
    a.href  = `data:${mime};charset=utf-8,` + encodeURIComponent(content);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
}
function downloadJson(filename,obj){
  downloadText(filename, JSON.stringify(obj,null,2));
}

function renderOrderBoard(){
  // 対象: SUBMITTED / APPROVED / ORDERED / PARTIALLY_RECEIVED
  const ACTIVE = ["SUBMITTED","APPROVED","ORDERED","PARTIALLY_RECEIVED"];
  const reqs = [...state.requests.filter(r=>ACTIVE.includes(r.status))]
    .sort((a,b)=>{
      // ステータス順: ORDERED→PARTIALLY_RECEIVED→APPROVED→SUBMITTED
      const order={ORDERED:0,PARTIALLY_RECEIVED:1,APPROVED:2,SUBMITTED:3};
      const sd = (order[a.status]??9)-(order[b.status]??9);
      if(sd!==0) return sd;
      return priorityOrder(a.priority)-priorityOrder(b.priority);
    });

  if(!reqs.length){
    $("order-board").innerHTML=`<div class="card"><div class="muted">${t("order_board_empty")}</div></div>`;
    return;
  }

  // ステータスラベルマップ
  const statusLabel_ob = {
    SUBMITTED: t("ob_submitted"),
    APPROVED:  t("ob_approved"),
    ORDERED:   t("ob_ordered"),
    PARTIALLY_RECEIVED: t("ob_partial"),
  };
  const statusColor = {
    SUBMITTED:"#eef2ff:#3730a3",
    APPROVED:"#fef3c7:#a16207",
    ORDERED:"#dcfce7:#166534",
    PARTIALLY_RECEIVED:"#dbeafe:#1d4ed8",
  };

  // 品目行を生成（依頼の各 line を1行として展開）
  const rows = [];
  reqs.forEach(req=>{
    req.lines.forEach(line=>{
      const rcv = receivedQtyForLine(line.id);
      const total = Number(line.quantityRequested)||0;
      const pct = total>0 ? Math.round(rcv/total*100) : 0;
      const [bg, col] = (statusColor[req.status]||"#f1f5f9:#475569").split(":");
      rows.push({ req, line, rcv, total, pct, bg, col });
    });
  });

  $("order-board").innerHTML=`
    <div class="card">
      <div class="hint">${t("order_board_sub")}</div>
      <div class="tableWrap">
        <table>

  const recentRecv = (state.receipts||[]).filter(r=>r.receivedById===ui.currentUserId).slice(-5).reverse();

      </div>
      <div class="card">

                <div class="listItem">
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                    <div>
                      <div style="font-weight:700">${r.requestNo}</div>
                      <div class="small muted">${userById(r.requesterId)?.name||"-"} / ${r.purpose||"-"}</div>
                    </div>
                    <span class="badge ${statusClass(r.status)}">${statusLabel(r.status)}</span>
                  </div>
                </div>`).join("")}
          </div>
        `}
      </div>

    </div>

    <!-- 低在庫アラート -->
    ${low.length>0 ? `
    <div class="card" style="margin-top:18px">
      <h3>${t("dash_low_alert")} (${low.length}${ui.lang==="en"?" items":"件"})</h3>
      <div class="tableWrap">
        <table>
          <thead><tr><th>${t("th_product")}</th><th>${t("th_remaining")}</th><th>${t("th_location")}</th><th></th></tr></thead>
          <tbody>${low.map(i=>`
            <tr>
              <td style="font-weight:700">${i.displayName}</td>
              <td style="color:var(--red);font-weight:700">${fmtQty(i.currentQuantity)} ${i.quantityUnit}</td>
              <td class="small muted">${locationPath(i.locationId)}</td>
              <td><button class="btn secondary" style="padding:4px 8px;font-size:12px"
                onclick="prefillRequestFromInventory('${i.id}')">${t("btn_place_order")}</button></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>` : ""}
  `;
}
// 教授・秘書ダッシュボードから直接承認・差し戻し
function quickApprove(reqId){
  const req = requestById(reqId);
  if(!req || req.status !== "SUBMITTED") return;
  req.status = "APPROVED";
  req.approverId = ui.currentUserId;
  req.approvedAt = TODAY;
  req.approvalComment = "";
  render();
}
function quickReject(reqId){
  const req = requestById(reqId);
  if(!req || req.status !== "SUBMITTED") return;
  req.status = "REJECTED";
  req.approverId = ui.currentUserId;
  req.approvedAt = TODAY;
  req.approvalComment = t("btn_quick_reject");
  render();
}

// バックアップ / 復元
// ═══════════════════════════════════════════════════════
function backupData(){
  const payload = {
    _meta:{ version:"v1", exportedAt: new Date().toISOString(), app:"Lab Inventory Mock" },
    state: state,
  };
  downloadJson("lab_inventory_backup_"+TODAY+".json", payload);
}
function restoreData(){
  if(!confirm(t("restore_confirm"))) return;
  const input = document.createElement("input");
  input.type = "file"; input.accept = ".json,application/json";
  input.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const payload = JSON.parse(ev.target.result);
        const newState = payload.state || payload; // 旧形式互換
        // 最低限のキーチェック
        if(!newState.users || !newState.inventory || !newState.products)
          throw new Error("invalid");
        state = newState;
        $("restore-msg").innerHTML=`<div class="message success">${t("restore_ok")}</div>`;
        render();
      }catch(err){
        $("restore-msg").innerHTML=`<div class="message info">${t("restore_err")}</div>`;
      }
    };
    reader.readAsText(file);
  };
  document.body.appendChild(input); input.click(); input.remove();
}
